<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>❋ 雪花写作法工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❋</text></svg>">
<link rel="stylesheet" href="style.css?v=7">
<link rel="stylesheet" href="flow.css?v=6">
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">❋</div>
    <h2 class="login-title">雪花写作法工作台</h2>
    <p class="login-sub">请输入密码以继续</p>
    <form onsubmit="doLogin(); return false;" autocomplete="off">
    <input type="password" id="login-password" placeholder="密码" autocomplete="current-password" autofocus>
    <button type="submit" class="login-btn" id="login-btn">进入</button>
    </form>
    <div id="login-error"></div>
  </div>
</div>

<div id="app-main" style="display:none">
<header class="app-header">
  <div class="brand">
    <button id="menu-btn" aria-label="打开步骤导航" aria-expanded="false">☰</button>
    <span class="logo" aria-hidden="true">❋</span>
    <div class="brand-copy">
      <span class="brand-kicker">V2.2 · 桌面创作工作台</span>
      <h1>雪花写作法</h1>
    </div>
  </div>
  <div class="project-switcher">
    <label class="sr-only" for="project-picker">当前作品</label>
    <select id="project-picker" title="切换作品"></select>
    <button class="ghost project-rename-trigger" id="project-rename-btn" onclick="openRenameProject()" title="修改当前设计文稿名称">改名</button>
    <button class="ghost" onclick="newProject()" title="在数据库中新建作品">＋ 新建</button>
    <button class="ghost project-delete-trigger" id="project-delete-btn" onclick="openDeleteProject()" title="删除当前设计文稿">删除</button>
    <button class="ghost" onclick="document.getElementById('project-import').click()" title="导入另一个 SnowFlake 数据库">导入数据库</button>
    <input id="project-import" type="file" accept=".db,.sqlite,.sqlite3" hidden onchange="importDatabase(this.files[0]);this.value=''">
  </div>
  <span class="spacer"></span>
  <div class="workspace-summary">
    <div id="progress-bar-wrap" title="整体完成进度">
      <span class="progress-label">整体进度</span>
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-pct">0%</span>
    </div>
    <div class="legend" aria-label="步骤状态说明">
      <span class="d-done"><b>●</b> 完成</span>
      <span class="d-draft"><b>●</b> 草案</span>
      <span class="d-todo"><b>●</b> 待办</span>
    </div>
  </div>
  <div class="icon-group">
    <button class="ghost ibtn" onclick="toggleSearch()" title="全文搜索 (Ctrl+F)" aria-label="全文搜索">🔍</button>
    <button class="ibtn" onclick="openSettings()" title="数据库与应用设置" aria-label="数据库与应用设置">⚙</button>
    <button class="ibtn" id="theme-toggle" onclick="toggleTheme()" title="切换主题" aria-label="切换主题">🌓</button>
    <button class="ibtn lock-btn" id="lock-btn" onclick="doLock()" title="锁屏" aria-label="锁屏">🔒</button>
  </div>
  <span id="saved-tag" aria-live="polite">加载中…</span>
</header>
<div id="search-panel">
  <div class="search-inner">
    <input type="text" id="search-input" placeholder="搜索当前作品…" onkeydown="onSearchKey(event)">
    <button onclick="doSearch()">搜索</button>
    <button class="ghost" onclick="toggleSearch()">关闭</button>
  </div>
  <div id="search-results"></div>
</div>
<div class="wrap">
  <div id="sidebar-backdrop"></div>
  <aside id="sidebar"></aside>
  <main>
    <div class="timeline" id="timeline" aria-label="雪花写作步骤"></div>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="ext-banner"><span class="b">●</span> 当前作品已在其他页面更新 <button class="primary" onclick="reloadProject()">刷新</button></div>
<div id="global-stats" aria-live="polite"></div>
<div class="toast" id="toast" role="status">已保存</div>

<div class="modal-backdrop" id="settings-modal" onclick="if(event.target===this)closeSettings()">
  <section class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-head"><div><span>本地数据库</span><h2 id="settings-title">应用设置</h2></div><button class="ibtn" onclick="closeSettings()" aria-label="关闭设置">×</button></div>
    <div class="settings-body">
      <label class="settings-field"><span>数据库文件</span><input id="settings-db" readonly><small>正文、走向图和设置全部保存在此文件中。</small></label>
      <label class="settings-field" id="settings-port-field"><span>服务端口</span><input id="settings-port" type="number" min="1024" max="65535"><small>修改端口后需要重启工作台。</small></label>
      <label class="settings-field"><span>设置新密码</span><input id="settings-password" type="password" maxlength="128" placeholder="留空表示不修改" autocomplete="new-password"></label>
      <label class="settings-check"><input id="settings-clear-password" type="checkbox"><span>清除当前密码，启动后直接进入</span></label>
      <div class="settings-storage-note"><strong>统一存储</strong><span>正文、条目、走向图和应用设置全部写入当前 SQLite 数据库。</span></div>
    </div>
    <div class="settings-actions"><button class="ghost" id="settings-open-folder" onclick="openDataFolder()" style="display:none">打开数据目录</button><span class="spacer"></span><button class="ghost" onclick="closeSettings()">取消</button><button class="primary" onclick="saveSettings()">保存设置</button></div>
  </section>
</div>

<div class="modal-backdrop" id="rename-project-modal" onclick="if(event.target===this)closeRenameProject()">
  <section class="settings-card rename-project-card" role="dialog" aria-modal="true" aria-labelledby="rename-project-title">
    <div class="settings-head"><div><span>当前作品</span><h2 id="rename-project-title">修改作品名称</h2></div><button class="ibtn" onclick="closeRenameProject()" aria-label="取消重命名">×</button></div>
    <div class="settings-body">
      <label class="settings-field" for="rename-project-name"><span>新作品名称</span><input id="rename-project-name" type="text" maxlength="160" autocomplete="off" spellcheck="false" oninput="updateRenameProject()" onkeydown="if(event.key==='Enter')confirmRenameProject()"><small id="rename-project-hint">仅修改名称，雪花步骤、人物、章节和走向图都会完整保留。</small></label>
    </div>
    <div class="settings-actions"><button class="ghost" onclick="closeRenameProject()">取消</button><button class="primary" id="rename-project-confirm" onclick="confirmRenameProject()">保存新名称</button></div>
  </section>
</div>

<div class="modal-backdrop" id="delete-project-modal" onclick="if(event.target===this)closeDeleteProject()">
  <section class="delete-project-card" role="dialog" aria-modal="true" aria-labelledby="delete-project-title">
    <div class="delete-project-head">
      <span id="delete-project-step">确认 1 / 3</span>
      <button class="ibtn" onclick="closeDeleteProject()" aria-label="取消删除">×</button>
    </div>
    <div class="delete-project-body">
      <div class="delete-project-icon" aria-hidden="true">!</div>
      <h2 id="delete-project-title">删除当前设计文稿？</h2>
      <p id="delete-project-message"></p>
      <div class="delete-project-name" id="delete-project-name"></div>
      <div class="delete-project-confirm-field" id="delete-project-confirm-wrap">
        <label for="delete-project-confirm-name">请输入完整文稿名称以确认</label>
        <input id="delete-project-confirm-name" autocomplete="off" spellcheck="false" aria-describedby="delete-project-match-hint" oninput="updateDeleteConfirmation()" onkeydown="if(event.key==='Enter')confirmDeleteProject()">
        <small id="delete-project-match-hint">名称必须完全一致</small>
      </div>
    </div>
    <div class="delete-project-actions">
      <button class="ghost" onclick="closeDeleteProject()">取消</button>
      <button class="danger" id="delete-project-next" onclick="advanceDeleteProject()">继续</button>
      <button class="danger" id="delete-project-confirm" onclick="confirmDeleteProject()">永久删除</button>
    </div>
  </section>
</div>
</div>

<script src="flow.js?v=7"></script>
<script src="app.js?v=20"></script>
</body>
</html>

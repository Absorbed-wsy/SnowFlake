<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>❋ 雪花写作法工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❋</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">❋</div>
    <h2 class="login-title">雪花写作法工作台</h2>
    <p class="login-sub">请输入密码以继续</p>
    <form onsubmit="doLogin(); return false;" autocomplete="off">
    <input type="password" id="login-password" placeholder="密码" autocomplete="current-password" autofocus>
    <button type="submit" class="login-btn" id="login-btn">进入</button>
    </form>
    <div id="login-error"></div>
  </div>
</div>

<div id="app-main" style="display:none">
<header>
  <button id="menu-btn">☰</button>
  <span class="logo">❋</span>
  <h1>雪花写作法工作台</h1>
  <div class="filewrap">
    <select id="file-picker" title="切换设计文件"></select>
    <button class="ghost" onclick="newFile()" title="从模板新建">＋ 新建</button>
  </div>
  <span class="spacer"></span>
  <div class="legend">
    <span class="d-done"><b>●</b> 完成</span>
    <span class="d-draft"><b>●</b> 草案</span>
    <span class="d-todo"><b>●</b> 待办</span>
  </div>
  <div id="progress-bar-wrap" title="整体完成进度">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <span id="progress-pct">0%</span>
  </div>
  <div class="icon-group">
    <button class="ghost ibtn" onclick="toggleSearch()" title="全文搜索 (Ctrl+F)">🔍</button>
    <button class="ghost ibtn" onclick="exportFull()" title="导出全文 Markdown">📥</button>
    <button class="ibtn" id="theme-toggle" onclick="toggleTheme()" title="切换主题">🌓</button>
    <button class="ibtn lock-btn" id="lock-btn" onclick="doLock()" title="锁屏">🔒</button>
  </div>
  <span id="saved-tag">加载中…</span>
</header>
<div id="search-panel">
  <div class="search-inner">
    <input type="text" id="search-input" placeholder="搜索关键词…" onkeydown="onSearchKey(event)">
    <button onclick="doSearch()">搜索</button>
    <button class="ghost" onclick="toggleSearch()">关闭</button>
  </div>
  <div id="search-results"></div>
</div>
<div class="wrap">
  <div id="sidebar-backdrop"></div>
  <aside id="sidebar"></aside>
  <main>
    <div class="timeline" id="timeline"></div>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="ext-banner"><span class="b">●</span> 笔记文件已被外部更新 <button class="primary" onclick="reloadDoc(true)">刷新</button></div>
<div id="global-stats"></div>
<div class="toast" id="toast">已保存</div>
</div>

<script src="app.js?v=7"></script>
</body>
</html>
